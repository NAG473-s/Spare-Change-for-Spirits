[package]
name = "spare_change_for_spirits"
version = "0.1.0"
edition = "2024"
authors = ["Sebastian Rode"]
description = "A shop management game for ghosts"
# All rights reserved, see LICENSE. Not for crates.io.
license-file = "LICENSE"
publish = false

[features]
# The Steam demo: stops after `demo_nights` (assets/data/config.ron).
demo = []

[dependencies]
# complex_script_segmentation: line breaking data for Chinese, Japanese and
# Thai, which have no spaces between words.
bevy = { version = "0.20.1", features = ["complex_script_segmentation"] }
keyvalues-parser = { version = "0.2.4", default-features = false }
libloading = "0.8.9"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
winit = { version = "0.30", default-features = false }

[build-dependencies]
embed-resource = "3.0.12"

# Fast debug builds: our own code lightly optimised, dependencies fully.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

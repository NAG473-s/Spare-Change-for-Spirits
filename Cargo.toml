[package]
name = "spare_change_for_spirits"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }

# Schnelle Debug-Builds: eigener Code leicht optimiert, Abhängigkeiten voll.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

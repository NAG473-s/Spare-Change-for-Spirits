name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }} · full and demo
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
          - name: macOS Universal
            runner: macos-15
            platform: macos-universal
    uses: ./.github/workflows/package-desktop.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}

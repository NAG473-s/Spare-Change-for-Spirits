name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

# Never run two Windows builds of the same ref side by side. A new run waits
# instead of cancelling the running one, so that one can still save its cache.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - id: toolchain
        uses: dtolnay/rust-toolchain@stable

      # Restore the newest matching cache: same toolchain and Cargo.lock first,
      # otherwise the newest one of the same toolchain.
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: windows-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            windows-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
            windows-${{ steps.toolchain.outputs.cachekey }}-

      # Both editions: the full game, then the demo (`--features demo`). Each
      # executable is copied aside right away, since both builds write the
      # same file in target/release.
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path editions | Out-Null
          cargo build --release --locked
          Copy-Item target/release/spare_change_for_spirits.exe editions/full.exe
          cargo build --release --locked --features demo
          Copy-Item target/release/spare_change_for_spirits.exe editions/demo.exe

      - name: Test
        run: |
          cargo test --release --locked
          cargo test --release --locked --features demo

      # Save right away – also when a step failed or the run was cancelled –
      # so the next run continues where this one stopped instead of starting over.
      # Every run saves under its own key; GitHub evicts old caches on its own.
      - name: Save build cache
        if: always() && steps.cache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The Steam API (achievements, the Steam language) is loaded at launch
      # from beside the .exe. Take Valve's redistributable from the
      # steamworks-sys package, pinned and checked against its SHA-256.
      - name: Fetch the Steam API library
        shell: pwsh
        run: |
          $version = "0.13.0"
          $sha256 = "ae139f051204a4af015d4f0ed3a1f7a51020d03a44c7cf249168c543d88131e9"
          Invoke-WebRequest "https://crates.io/api/v1/crates/steamworks-sys/$version/download" -OutFile steamworks-sys.crate
          if ((Get-FileHash steamworks-sys.crate -Algorithm SHA256).Hash.ToLower() -ne $sha256) {
            throw "steamworks-sys $version does not match its checksum"
          }
          tar -xzf steamworks-sys.crate "steamworks-sys-$version/lib/steam/redistributable_bin/win64/steam_api64.dll"
          Move-Item "steamworks-sys-$version/lib/steam/redistributable_bin/win64/steam_api64.dll" steam_api64.dll

      # One folder per edition, each for its own Steam depot.
      - name: Package
        shell: pwsh
        run: |
          foreach ($edition in "full", "demo") {
            $out = "dist/$edition/SpareChangeForSpirits"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            Copy-Item "editions/$edition.exe" "$out/SpareChangeForSpirits.exe"
            Copy-Item steam_api64.dll "$out/steam_api64.dll"
            Copy-Item -Recurse assets "$out/assets"
            Copy-Item LICENSE "$out/LICENSE.txt"
            Copy-Item THIRD_PARTY_LICENSES.txt "$out/THIRD_PARTY_LICENSES.txt"
            Get-ChildItem -Recurse -Filter .gitkeep $out | Remove-Item
          }

      - uses: actions/upload-artifact@v7
        with:
          name: SpareChangeForSpirits-windows
          path: dist/full/SpareChangeForSpirits
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: SpareChangeForSpirits-windows-demo
          path: dist/demo/SpareChangeForSpirits
          if-no-files-found: error
